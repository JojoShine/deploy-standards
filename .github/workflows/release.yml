name: Promote release
on:
  push:
    tags: [v*]
  workflow_call:
    inputs:
      business:
        required: true
        type: string
      standard-ref:
        required: true
        type: string
      base-path:
        type: string
        default: ""
      variant:
        type: string
        default: ""
      project-dir:
        type: string
        default: .
permissions:
  contents: read
concurrency:
  group: standard-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      BUSINESS: ${{ inputs.business || 'deploy-standards-example' }}
      STANDARD_REF: ${{ inputs.standard-ref || github.sha }}
      BASE_PATH: ${{ inputs.base-path }}
      VARIANT: ${{ inputs.variant }}
      PROJECT_SUBDIR: ${{ inputs.project-dir || '.' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JojoShine/deploy-standards
          ref: ${{ env.STANDARD_REF }}
          path: .standards
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Verify version, main commit and tested candidate
        env:
          VERSION: ${{ github.ref_name }}
          NATIVE: ${{ inputs.business == '' }}
        run: |
          PYTHONPATH=.standards/tools python -c 'import os; from standards import validate_version,validate_sha; validate_version(os.environ["VERSION"]); validate_sha(os.environ["STANDARD_REF"])'
          commit=$(git -C project rev-parse HEAD)
          git -C project merge-base --is-ancestor "$commit" origin/main
          python .standards/tools/find-candidate.py --business "$BUSINESS" --commit "$commit" --repository "$GITHUB_REPOSITORY" --output candidate.json --base-path "$BASE_PATH" --variant "$VARIANT"
          if [ "$NATIVE" = true ]; then
            python .standards/tools/init-project.py --business "$BUSINESS" --output "$RUNNER_TEMP/reference" --standards-ref "$STANDARD_REF" --owner "$GITHUB_REPOSITORY_OWNER"
            project_dir="$RUNNER_TEMP/reference"
          else
            project_dir="$GITHUB_WORKSPACE/project/$PROJECT_SUBDIR"
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact manifests and package deployment config
        env:
          VERSION: ${{ github.ref_name }}
        run: python .standards/tools/promote-release.py --candidate candidate.json --version "$VERSION" --project-dir "$PROJECT_DIR" --output "deploy-$VERSION.tar.gz"
      - name: Publish release assets without overwriting
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release already exists; asset overwrite is forbidden.' >&2
            exit 1
          fi
          gh release create "$VERSION" "deploy-$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --generate-notes
