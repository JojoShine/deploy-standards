name: Deploy an immutable release
on:
  workflow_call:
    inputs:
      business:
        required: true
        type: string
      version:
        required: true
        type: string
      environment:
        type: string
        default: production
      public-health-url:
        required: true
        type: string
      app-port:
        required: true
        type: number
      standard-ref:
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true
      SSH_PORT:
        required: false
permissions:
  contents: read
concurrency:
  group: standard-deploy-${{ github.repository }}-${{ inputs.business }}-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      BUSINESS: ${{ inputs.business }}
      VERSION: ${{ inputs.version }}
      DEPLOY_ENV: ${{ inputs.environment }}
      PUBLIC_HEALTH_URL: ${{ inputs.public-health-url }}
      APP_PORT: ${{ inputs.app-port }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: JojoShine/deploy-standards
          ref: ${{ inputs.standard-ref }}
          path: .standards
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Download and verify versioned deployment package
        run: |
          PYTHONPATH=.standards/tools python -c 'import os; from standards import validate_business,validate_version; validate_business(os.environ["BUSINESS"]); validate_business(os.environ["DEPLOY_ENV"]); validate_version(os.environ["VERSION"])'
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "deploy-$VERSION.tar.gz" --dir "$RUNNER_TEMP/bundle"
          python .standards/tools/remote-deploy.py --bundle "$RUNNER_TEMP/bundle/deploy-$VERSION.tar.gz"
