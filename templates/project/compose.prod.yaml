services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable image reference}
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "8080"
      BASE_PATH: ${BASE_PATH:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT is required}:8080"
    healthcheck:
      test: [CMD, /app/bin/healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 12
  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE must be an immutable image reference}
    profiles: [ops]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    command: [/app/bin/migrate]
