name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  candidate:
    permissions:
      contents: read
      packages: write
    uses: JojoShine/deploy-standards/.github/workflows/ci.yml@__STANDARDS_REF__
    with:
      business: __BUSINESS__
      checks: npm run check
      build-context: .
      dockerfile: Dockerfile
      base-path: ""
      variant: ""
      postgres-image: postgres:16-alpine
      standard-ref: __STANDARDS_REF__
