# Synthetic local-only credentials. Never copy them into production.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starter_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: starter_local
    volumes:
      - starter-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U starter_local -d starter_local]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: runtime
    environment:
      PORT: "8080"
      BASE_PATH: ${BASE_PATH:-}
      DATABASE_URL: postgresql://starter_local:local-development-only@database:5432/starter_local
    ports:
      - "127.0.0.1:${APP_PORT:-31001}:8080"
    depends_on:
      database:
        condition: service_healthy
  migrate:
    build:
      context: .
      target: migrate
    profiles: [ops]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://starter_local:local-development-only@database:5432/starter_local
    depends_on:
      database:
        condition: service_healthy
    command: [/app/bin/migrate]
volumes:
  starter-data:
